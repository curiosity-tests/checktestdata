name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            container:
          - name: Debian 13
            os: ubuntu-latest
            container: debian:13

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}

    name: "Build & Test (${{ matrix.name }})"

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install container prerequisites
        if: matrix.container
        run: apt-get update && apt-get install -y git sudo

      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            g++ \
            make \
            libboost-regex-dev \
            libgmp-dev \
            bisonc++ \
            flexc++

      - name: Bootstrap and configure
        run: |
          aclocal -I m4
          autoconf
          ./configure

      - name: Generate parser
        run: make dist

      - name: Build
        run: make build

      - name: Test
        run: make check
